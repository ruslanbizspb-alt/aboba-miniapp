<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@800&family=Unbounded:wght@800&family=JetBrains+Mono:wght@700&display=block" rel="stylesheet">
<style>
html,body{margin:0;background:#0E0F13;overflow:hidden}
#st{position:relative;width:390px;height:480px;background:#0E0F13;overflow:hidden}
.glow{position:absolute;left:50%;top:48%;width:420px;height:420px;margin:-210px 0 0 -210px;border-radius:50%;background:radial-gradient(closest-side,var(--a88),var(--a00));animation:glow 1.6s ease .3s both}
.shadow{position:absolute;left:50%;top:50%;width:250px;height:36px;margin:112px 0 0 -125px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.6),rgba(0,0,0,0));animation:fade .8s ease 1.6s both}
.scene{position:absolute;left:50%;top:50%;width:300px;height:190px;margin:-95px 0 0 -150px;perspective:1100px;animation:appear .25s linear both}
.card{position:absolute;inset:0;transform-style:preserve-3d;animation:enter 2.1s cubic-bezier(.16,.84,.24,1) both}
.face{position:absolute;inset:0;border-radius:22px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;color:#fff;font-family:Manrope,sans-serif}
.front{background:linear-gradient(135deg,var(--c1),var(--c0));box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
.back{transform:rotateY(180deg);background:linear-gradient(135deg,var(--c0),var(--cd))}
.wm{position:absolute;right:-26px;bottom:-70px;font:800 250px/1 Unbounded,sans-serif;color:rgba(255,255,255,.08)}
.logo{position:absolute;left:18px;top:18px;display:flex;align-items:center;gap:8px}.logo i{width:30px;height:30px;border-radius:9px;background:#fff;color:var(--a);font:800 14px Unbounded,sans-serif;font-style:normal;display:flex;align-items:center;justify-content:center}.logo b{font-size:15px}
.chip{position:absolute;left:18px;top:76px;width:38px;height:28px;border-radius:6px;background:linear-gradient(135deg,#F1E4B8,#D8C68E)}
.num{position:absolute;left:18px;bottom:20px;font:700 15px 'JetBrains Mono',monospace;letter-spacing:2px}.usd{position:absolute;right:18px;bottom:18px;font-size:13px;font-weight:800}
.stripe{position:absolute;left:0;right:0;top:26px;height:40px;background:#08090C}
.sig{position:absolute;left:18px;top:84px;width:170px;height:30px;border-radius:5px;background:repeating-linear-gradient(135deg,rgba(255,255,255,.18) 0 6px,rgba(255,255,255,.08) 6px 12px)}
.bmark{position:absolute;right:18px;bottom:16px;display:flex;align-items:center;gap:6px;opacity:.85;font-size:12px;font-weight:800}
.sheen{position:absolute;top:0;bottom:0;left:0;width:60%;background:linear-gradient(105deg,rgba(255,255,255,0),rgba(255,255,255,.35) 50%,rgba(255,255,255,0));animation:glare 1s ease 2.15s both}
@keyframes enter{0%{transform:translateY(300px) rotateX(35deg) rotateY(0) scale(.55)}72%{transform:translateY(-8px) rotateX(6deg) rotateY(-700deg) scale(1.03)}100%{transform:translateY(0) rotateX(0) rotateY(-720deg) scale(1)}}
@keyframes appear{0%{opacity:0}100%{opacity:1}}
@keyframes glow{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes glare{0%{transform:translateX(-140%)}100%{transform:translateX(220%)}}
</style></head><body><div id="st"><div class="glow"></div><div class="shadow"></div>
<div class="scene"><div class="card">
 <div class="face front"><div class="wm" id="wm"></div><div class="logo"><i id="m1"></i><b id="nm"></b></div><div class="chip"></div><div class="num">•••• •••• •••• 4417</div><div class="usd">USD</div><div class="sheen"></div></div>
 <div class="face back"><div class="stripe"></div><div class="sig"></div><div class="bmark"><span id="m2"></span><span id="nm2"></span></div></div>
</div></div></div>
<script>
const P=new URLSearchParams(location.search),A='#'+(P.get('accent')||'6D4AFF').replace('#',''),N=P.get('name')||'Aboba Card',M=(P.get('mark')||'A').slice(0,2);
const h=x=>[1,3,5].map(i=>parseInt(x.slice(i,i+2),16)),mix=(a,b,t)=>'#'+h(a).map((v,i)=>Math.round(v+(h(b)[i]-v)*t).toString(16).padStart(2,'0')).join('');
const r=document.documentElement.style,c0=mix(A,'#0E0F13',.2);
r.setProperty('--a',A);r.setProperty('--a88',A+'88');r.setProperty('--a00',A+'00');r.setProperty('--c0',c0);r.setProperty('--c1',mix(c0,'#FFFFFF',.08));r.setProperty('--cd',mix(A,'#0E0F13',.55));
wm.textContent=M[0];m1.textContent=M;nm.textContent=N;m2.textContent=M;nm2.textContent=N;
window.seek=t=>document.getAnimations().forEach(a=>{a.pause();a.currentTime=t});
</script></body></html>
