<style>

html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none}

.u{font-family:Unbounded,sans-serif}.mono{font-family:'JetBrains Mono',monospace}
.row{display:flex;align-items:center}.col{display:flex;flex-direction:column}.between{justify-content:space-between}
.mu{color:var(--mu)}
.page{min-height:100vh;padding:16px 16px 100px;display:flex;flex-direction:column;gap:18px;animation:in .25s ease}

.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;padding:4px;border-radius:16px;background:var(--s1)}
.seg button{height:42px;border-radius:12px;font-size:14px;font-weight:800;color:var(--mu)}
.seg button.on{background:#2A2C35;color:var(--tx)}
.pill{height:36px;padding:0 14px;border-radius:18px;background:var(--s1);color:#C9CBD3;font-size:13px;font-weight:800;white-space:nowrap;flex-shrink:0}

.grab{align-self:center;width:40px;height:5px;border-radius:3px;background:#34363F}

function spinTo(k){if(k===S.st)return;spin(((k-S.st+3)%3)===1?1:-1)}

function qr(seed){const N=21,out=[];let x=seed*9301+49297;const rnd=()=>{x=(x*9301+49297)%233280;return x/233280};const f=(r,c)=>{const g=(r0,c0)=>r>=r0&&r<r0+7&&c>=c0&&c<c0+7?(r===r0||r===r0+6||c===c0||c===c0+6||(r>=r0+2&&r<=r0+4&&c>=c0+2&&c<=c0+4)):null;return g(0,0)??g(0,14)??g(14,0)};for(let r=0;r<N;r++)for(let c=0;c<N;c++){const v=f(r,c);const sep=(r===7&&(c<8||c>12))||(c===7&&(r<8||r>12))||(r===13&&c<8)||(c===13&&r<8);out.push((v!==null?v:(!sep&&rnd()>.52))?'#0E0F13':'#FFFFFF')}return out}
const TOP=()=>S.m==='rub'?{key:'rub',step:500,min:1000,max:250000,presets:[2000,5000,10000,25000]}:{key:'usdt',step:5,min:10,max:5000,presets:[20,50,100,250]};
function setAmt(v){const c=TOP();S[c.key]=Math.max(c.min,Math.min(c.max,Math.round(v/c.step)*c.step));updRuler()}
function amtLabel(){return S.m==='rub'?sp(S.rub)+' ₽':sp(S.usdt)+' USDT'}
function updRuler(){const c=TOP(),a=S[c.key];const off=Math.round(-(a/c.step)*12)%60;const el=document.getElementById('ticks');if(!el)return;el.style.backgroundPosition=`${off}px 0, ${off}px 8px`;document.getElementById('amt').textContent=amtLabel();document.getElementById('lo').textContent=sp(Math.max(c.min,a-c.step*12));document.getElementById('hi').textContent=sp(Math.min(c.max,a+c.step*12));const ctab=document.getElementById('ctaAmt');if(ctab)ctab.textContent=amtLabel();document.querySelectorAll('[data-preset]').forEach(b=>b.classList.toggle('on',+b.dataset.preset===a))}

 <div class="col" style="padding:0 6px">

    <div style="border-top:1.5px dashed #B9B3A6"></div>

    <div class="row between" style="margin-top:4px"><svg width="150" height="34" viewBox="0 0 150 34" aria-hidden="true"><g fill="#1B1A17">${[0,5,9,13,20,24,29,34,38,45,50,54,60,65,72,76,81,87,91,98,103,107,113,118,125,129,135,140,144].map((x,i)=>`<rect x="${x}" width="${[3,1,2,4][i%4]}" height="34"/>`).join('')}</g></svg>
     <div class="col" style="transform:rotate(-10deg);border:2.5px solid ${mix(A,'#1B1A17',.15)};color:${mix(A,'#1B1A17',.15)};border-radius:9px;padding:4px 8px;align-items:center"><span style="font-size:9px;font-weight:800;letter-spacing:1px">ОПЛАЧЕНО</span><span class="u" style="font-weight:700;font-size:13px">${M}</span></div></div>
    <svg width="100%" height="12" viewBox="0 0 312 12" preserveAspectRatio="none" aria-hidden="true" style="position:absolute;left:0;bottom:-11px"><path fill="#FBFAF6" d="${zig}"/></svg>
   </div></div>
  <button style="align-self:center;margin-top:8px;height:34px;padding:0 14px;border-radius:17px;font-size:12px;font-weight:800;color:var(--mu);background:var(--s1)" onclick="reprint()">Напечатать ещё раз</button>
 </div>
 <div class="bottom"><button class="cta" style="height:52px;font-size:15px;gap:8px" onclick="sendReceipt()">${sv(I.plane,18,2.2)}Отправить чек в бот</button><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><button class="btn2" onclick="toast('Сохранение картинкой — скоро')">Сохранить</button><button class="btn2" onclick="go('home')">На главную</button></div></div>`;
};
function reprint(){const p=document.getElementById('paper');if(!p)return;p.classList.remove('printing');void p.offsetWidth;p.classList.add('printing');hap()}
function sendReceipt(){ok();toast('Чек отправлен в бот — демо')}

V.history=()=>{
 const rub=S.cur==='rub';
 const rows=HIST.filter(r=>S.hf==='Все'||r[5]===S.hf);
 const groups=[];rows.forEach(r=>{let g=groups.find(x=>x.l===r[0]);if(!g){g={l:r[0],i:[]};groups.push(g)}g.i.push(r)});
 return `<div class="row between">${inTg?'<span class="h1">История</span>':`<div class="row" style="gap:4px"><button aria-label="Назад" onclick="back()" style="width:36px;height:44px;margin-left:-8px;display:flex;align-items:center;justify-content:center">${sv(I.back,22,2)}</button><span class="h1">История</span></div>`}${curToggle()}</div>
 <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div class="box col" style="padding:14px;gap:4px;border-radius:18px"><span class="mu" style="font-size:12px">Потрачено в ноябре</span><span class="u" style="font-weight:600;font-size:19px">${rub?'9 860 ₽':'$107.20'}</span></div><div class="box col" style="padding:14px;gap:4px;border-radius:18px"><span class="mu" style="font-size:12px">Пополнено</span><span class="u" style="font-weight:600;font-size:19px;color:var(--ok)">${rub?'+9 600 ₽':'+$104.35'}</span></div></div>
 <div class="hs">${['Все','Карты','Пополнения','Сервисы'].map(n=>`<button class="pill ${n===S.hf?'on':''}" onclick="hap();set({hf:'${n}'})">${n}</button>`).join('')}</div>
 ${groups.length?groups.map(g=>`<div class="col"><span style="font-size:12px;font-weight:800;color:#8E909A;letter-spacing:1px;padding:4px 0 6px">${g.l}</span>${g.i.map(r=>txRow({m:r[1],n:r[2],s:r[3],a:r[4],bad:r[7]},r[6]?`go('receipt',{rtype:'${r[6]}'})`:'')).join('')}</div>`).join(''):`<div style="padding:30px 0;text-align:center;font-size:14px;color:#8E909A">В этой категории пока пусто</div>`}`;
};

V.profile=()=>{
 const base=[['Пополнение','[%]'],['Лимит в месяц','[сумма]'],['Кэшбэк','нет'],['Поддержка','обычная']],pl=[['Пополнение','[% ниже]'],['Лимит в месяц','[× N]'],['Кэшбэк','[%]'],['Поддержка','24/7, без очереди']];
 const rows=S.plusMode?pl:base;
 const code=(user.username||'aboba').toUpperCase().slice(0,8)+String(user.id||119).slice(-3);
 const tgl=(n,s,on,key)=>`<button role="switch" aria-checked="${on}" class="row" style="width:100%;min-height:54px;gap:12px;border-bottom:1px solid var(--s3);text-align:left" onclick="hap();set({${key}:!S.${key}})"><span class="col" style="gap:2px;flex:1"><span style="font-size:15px;font-weight:700">${n}</span><span class="mu" style="font-size:12px">${s}</span></span><span style="width:46px;height:28px;border-radius:14px;background:${on?A:'#3A3C45'};position:relative;flex-shrink:0"><span style="position:absolute;top:3px;left:${on?21:3}px;width:22px;height:22px;border-radius:11px;background:#fff;transition:left .2s"></span></span></button>`;
 return `<div class="row" style="gap:14px">${user.photo_url?`<img src="${user.photo_url}" alt="" style="width:56px;height:56px;border-radius:18px;object-fit:cover">`:`<div class="u" style="width:56px;height:56px;border-radius:18px;background:var(--s3);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:20px">${(user.first_name||'?')[0]}</div>`}<div class="col" style="gap:4px;flex:1"><span style="font-weight:800;font-size:18px">${user.first_name||'Гость'}</span><span class="mu" style="font-size:13px">${user.username?'@'+user.username+' · ':''}ID ${user.id}</span></div><span class="chip" style="height:28px;padding:0 12px;font-size:12px;${S.plus?'background:var(--accent);color:#fff':'background:var(--s3);color:#C9CBD3'}">${S.plus?'Plus':'Базовый'}</span></div>
 <div class="col" style="position:relative;overflow:hidden;border-radius:24px;background:${mix(A,'#0E0F13',.15)};padding:18px;gap:14px;color:#fff"><span class="wm" style="right:-14px;top:-50px;font-size:200px;color:rgba(255,255,255,.08)">+</span>
  <div class="row between" style="position:relative"><span class="u" style="font-weight:700;font-size:21px">${BRAND.name.split(' ')[0]} Plus</span><div class="row" style="gap:2px;padding:3px;border-radius:14px;background:rgba(0,0,0,.25)">${[['Базовый',0],['Plus',1]].map(([n,k])=>`<button style="height:28px;padding:0 10px;border-radius:11px;font-size:12px;font-weight:800;${k===S.plusMode?'background:#fff;color:#0E0F13':''}" onclick="hap();set({plusMode:${k}})">${n}</button>`).join('')}</div></div>
  <div class="col" style="position:relative;border-radius:16px;background:rgba(0,0,0,.22);padding:2px 14px">${rows.map((r,k)=>`<div class="row between" style="padding:10px 0;font-size:14px;${k<rows.length-1?'border-bottom:1px solid rgba(255,255,255,.12)':''}"><span style="opacity:.8">${r[0]}</span><b>${r[1]}</b></div>`).join('')}</div>
  <button style="position:relative;height:48px;border-radius:14px;background:#fff;color:#0E0F13;font-size:15px;font-weight:800" onclick="ok();set({plus:!S.plus})">${S.plus?'Plus подключён · управлять':'Подключить Plus · [цена] / мес'}</button></div>
 <div class="col" style="gap:10px"><span class="h2">Приглашай друзей</span>
  <div style="position:relative;display:flex;height:124px;border-radius:18px;overflow:hidden;background:var(--tx);color:var(--bg)">
   <div class="col between" style="flex:1;padding:14px 16px"><span style="font-size:11px;font-weight:800;letter-spacing:1px;color:#5A5D66">ПРИГЛАШЕНИЕ В ${BRAND.name.toUpperCase()}</span><span class="mono" style="font-weight:800;font-size:22px;letter-spacing:1px">${code}</span><span style="font-size:12px;color:#5A5D66">Друг выпускает карту — бонус обоим</span></div>
   <div style="border-left:2px dashed #B8BBC3;margin:12px 0"></div>
   <div class="col" style="width:104px;flex-shrink:0;background:var(--accent);color:#fff;align-items:center;justify-content:center;gap:2px"><span class="u" style="font-weight:700;font-size:18px">[$]</span><span style="font-size:11px;font-weight:800">тебе и другу</span></div>
   <span style="position:absolute;right:95px;top:-9px;width:18px;height:18px;border-radius:9px;background:var(--bg)"></span><span style="position:absolute;right:95px;bottom:-9px;width:18px;height:18px;border-radius:9px;background:var(--bg)"></span></div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><button class="cta" style="height:48px;font-size:14px;border-radius:14px" onclick="shareRef()">Отправить в Telegram</button><button class="btn2" onclick="copyRef()">Скопировать ссылку</button></div>
  <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">${[['Перешли','0'],['Выпустили','0'],['Заработано','[$]']].map((x,k)=>`<div class="box col" style="padding:12px;gap:2px;border-radius:14px"><span class="mu" style="font-size:11px">${x[0]}</span><span class="u" style="font-size:17px;font-weight:600;${k===2?'color:var(--ok)':''}">${x[1]}</span></div>`).join('')}</div></div>
 <div class="box" style="padding:0 16px">${tgl('ПИН-код на вход','Спрашивать при открытии',S.pin,'pin')}${tgl('Уведомления','Операции и коды в бот',S.push,'push')}
  ${[['Язык','Русский'],['Поддержка','24/7'],['Тарифы и лимиты',''],['Документы',''],['Показать заставку','']].map((l,k,a)=>`<button class="row" style="width:100%;min-height:52px;gap:12px;${k<a.length-1?'border-bottom:1px solid var(--s3)':''}" onclick="${l[0]==='Показать заставку'?"go('onboarding')":`toast('${l[0]} — скоро')`}"><span style="flex:1;text-align:left;font-size:15px;font-weight:700">${l[0]}</span><span class="mu" style="font-size:14px">${l[1]}</span><span class="mu">${sv(I.right,18,2)}</span></button>`).join('')}</div>
 <span style="font-size:12px;color:#8E909A;text-align:center">${BRAND.name} · драфт v3 · данные демонстрационные</span>`;
};
function refLink(){return 'https://t.me/OCTproBot?start=ref_'+(user.id||0)}
function copyRef(){try{navigator.clipboard.writeText(refLink())}catch(e){}ok();toast('Ссылка скопирована')}
function shareRef(){const u='https://t.me/share/url?url='+encodeURIComponent(refLink())+'&text='+encodeURIComponent('Карта для подписок и поездок прямо в Telegram');if(tg&&tg.openTelegramLink)tg.openTelegramLink(u);else window.open(u,'_blank')}

/* ---------- рендер и жесты ---------- */
const FULL=['onboarding'];
function render(){
 const s=S.screen,sub=!TABS.includes(s)&&!FULL.includes(s);
 const tab=(id,ic,l)=>`<button class="${s===id?'on':''}" onclick="go('${id}')">${sv(ic)}${l}</button>`;
 document.getElementById('app').innerHTML=(FULL.includes(s)?V[s]():`<main class="page ${sub?'sub':''}" style="position:relative">${V[s]()}</main>`)+(sub||FULL.includes(s)?'':`<nav class="tabs" aria-label="Навигация">${tab('home',I.home,'Главная')}${tab('card',I.card,'Карты')}${tab('catalog',I.grid,'Сервисы')}${tab('profile',I.user,'Профиль')}</nav>`);
 if(tg){sub?tg.BackButton.show():tg.BackButton.hide()}
 if(s==='topup'){updRuler();bindRuler()}
 if(s==='store')bindStage();
}
function bindRuler(){const el=document.getElementById('ruler');if(!el)return;let d=null;
 el.addEventListener('pointerdown',e=>{d={x:e.clientX,v:S[TOP().key]};try{el.setPointerCapture(e.pointerId)}catch(_){}});
 el.addEventListener('pointermove',e=>{if(!d)return;const c=TOP();const nv=Math.max(c.min,Math.min(c.max,Math.round((d.v-((e.clientX-d.x)/12)*c.step)/c.step)*c.step));if(nv!==S[c.key]){S[c.key]=nv;updRuler();try{tg&&tg.HapticFeedback.selectionChanged()}catch(_){}}});
 const end=()=>{d=null};el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end)}
function bindStage(){const st=document.getElementById('stage'),cd=document.getElementById('scard');if(!st||!cd)return;let sx=null,busy=false;
 st.addEventListener('pointerdown',e=>{sx=e.clientX});
 st.addEventListener('pointermove',e=>{if(busy||e.pointerType==='touch'&&sx===null)return;const r=st.getBoundingClientRect();const px=(e.clientX-r.left)/r.width-.5,py=(e.clientY-r.top)/r.height-.5;cd.style.transition='transform .15s ease-out';cd.style.transform=`rotateY(${S.spin+Math.round(px*30)}deg) rotateX(${Math.round(-py*20)}deg)`});
 const up=e=>{if(sx===null)return;const dx=e.clientX-sx;sx=null;if(Math.abs(dx)>40){busy=true;spin(dx<0?1:-1)}};
 st.addEventListener('pointerup',up);st.addEventListener('pointercancel',()=>{sx=null});
 st.addEventListener('pointerleave',()=>{sx=null;cd.style.transform=`rotateY(${S.spin}deg)`})}
render();
</script>
